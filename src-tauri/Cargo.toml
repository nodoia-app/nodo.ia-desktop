[package]
name = "nodo-desktop"
version = "1.0.0"
description = "Nodo desktop app"
authors = ["Nodo"]
edition = "2021"

[lib]
name = "nodo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
